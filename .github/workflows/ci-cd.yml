name: Backend CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # 1. Executa os testes unitários e de integração
  test:
    runs-on: ubuntu-latest

    # Sobe o Postgres com as credenciais padrão esperadas pelo TestDatabaseConfig
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fastrelax_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"

      - name: Tornar Maven Wrapper executável
        run: chmod +x mvnw

      - name: Executar Testes
        run: ./mvnw -B test
        env:
          # Configurações para os testes baterem no banco local do step services
          DB_URL: jdbc:postgresql://localhost:5432/fastrelax_test
          DB_USER: postgres
          DB_PASS: postgres
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/fastrelax_test
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
          JWT_SECRET: "chave_temporaria_apenas_para_testes_ci_cd_123456789"
          AES_SECRET: "chave_temporaria_aes_1234567890123"

  # 2. Build e Push da Imagem Docker (apenas no push da branch main)
  build-and-push:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/fastrelax-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 3. Deploy no Droplet DigitalOcean
  deploy:
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Executar Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            set -e

            # 1. Puxa a nova imagem
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/fastrelax-api:latest

            # 2. Para e remove o container em execução (se existir)
            docker stop backend || true
            docker rm backend || true

            # 3. Sobe o container conectado na rede 'fastrelax-network'
            docker run -d \
              --name backend \
              --restart unless-stopped \
              --network fastrelax-network \
              -p 8090:8090 \
              -e DB_URL=jdbc:postgresql://db:5432/${{ secrets.POSTGRES_DB }} \
              -e DB_USER=${{ secrets.POSTGRES_USER }} \
              -e DB_PASS=${{ secrets.POSTGRES_PASSWORD }} \
              -e MQTT_HOST=rabbitmq \
              -e RABBITMQ_AMQP_PORT=5672 \
              -e MQTT_DEVICE_PORT=1883 \
              -e MQTT_USERNAME=${{ secrets.MQTT_USERNAME }} \
              -e MQTT_PASSWORD=${{ secrets.MQTT_PASSWORD }} \
              -e MQTT_ENABLED=true \
              -e JWT_SECRET=${{ secrets.JWT_SECRET }} \
              -e AES_SECRET=${{ secrets.AES_SECRET }} \
              -e CORS_ALLOWED_ORIGINS="${{ secrets.CORS_ALLOWED_ORIGINS }}" \
              -e WEB_BASE_URL="http://${{ secrets.DO_HOST }}" \
              ${{ secrets.DOCKERHUB_USERNAME }}/fastrelax-api:latest

            # 4. Limpa imagens sem uso
            docker image prune -f
