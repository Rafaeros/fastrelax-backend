info:
  name: Configurar Wi-Fi da Minha Empresa
  type: http
  seq: 2

http:
  method: PATCH
  url: "{{baseUrl}}/companies/me/wifi"
  auth: inherit
  body:
    type: json
    data: |-
      {
        "wifiSsid": "Corporativo-IoT",
        "wifiPassword": "SenhaSeguraDoWifi123"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Salva o SSID e a senha da rede das cadeiras (cifrada com AES-GCM no banco).
