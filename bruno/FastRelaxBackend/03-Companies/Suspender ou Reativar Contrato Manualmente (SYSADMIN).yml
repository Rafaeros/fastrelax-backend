info:
  name: Suspender ou Reativar Contrato Manualmente (SYSADMIN)
  type: http
  seq: 7

http:
  method: PATCH
  url: "{{baseUrl}}/companies/{{companyId}}/toggle-active"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Suspende ou reativa manualmente o contrato de uma empresa (registrado no `audit_logs`).
