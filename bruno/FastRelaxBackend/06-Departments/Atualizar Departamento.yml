info:
  name: Atualizar Departamento
  type: http
  seq: 4

http:
  method: PUT
  url: "{{baseUrl}}/departments/{{departmentId}}"
  auth: inherit
  body:
    type: json
    data: |-
      {
        "name": "Engenharia e Produto",
        "active": true
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Atualiza o nome e situação de um departamento.
