info:
  name: Criar Departamento
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/departments"
  auth: inherit
  body:
    type: json
    data: |-
      {
        "name": "Engenharia de Software"
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody ? res.getBody() : res.body;
        if (body?.data?.id) {
          bru.setEnvVar("departmentId", String(body.data.id));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Cria um departamento na empresa e salva o `departmentId` no Bruno.
