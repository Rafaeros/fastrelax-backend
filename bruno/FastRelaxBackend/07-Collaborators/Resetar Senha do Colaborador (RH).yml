info:
  name: Resetar Senha do Colaborador (RH)
  type: http
  seq: 11

http:
  method: PATCH
  url: "{{baseUrl}}/collaborators/{{collaboratorId}}/password"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Gera nova senha temporária para o colaborador.
