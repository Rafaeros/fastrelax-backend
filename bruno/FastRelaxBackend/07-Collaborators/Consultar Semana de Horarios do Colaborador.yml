info:
  name: Consultar Semana de Horários do Colaborador
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseUrl}}/collaborators/{{collaboratorId}}/schedules"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Lista os dias da semana e faixas de horário permitidas de um colaborador.
