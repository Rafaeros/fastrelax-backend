info:
  name: Listar Colaboradores
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/collaborators?page=0&size=10"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Lista os colaboradores da empresa com filtros opcionais (`name`, `cpf`, `departmentId`, `active`).
