info:
  name: Atualizar Colaborador
  type: http
  seq: 5

http:
  method: PUT
  url: "{{baseUrl}}/collaborators/{{collaboratorId}}"
  auth: inherit
  body:
    type: json
    data: |-
      {
        "departmentId": {{departmentId}},
        "name": "Maria dos Santos Silva",
        "cpf": "",
        "phoneNumber": "11988887777",
        "email": "maria.silva@acme.com.br",
        "active": true
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Atualiza dados do colaborador (`cpf` vazio mantém o CPF atual).
