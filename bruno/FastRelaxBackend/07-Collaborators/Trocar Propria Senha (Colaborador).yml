info:
  name: Trocar Própria Senha (Colaborador)
  type: http
  seq: 10

http:
  method: PATCH
  url: "{{baseUrl}}/collaborators/me/password"
  auth: inherit
  body:
    type: json
    data: |-
      {
        "currentPassword": "{{collaboratorPassword}}",
        "newPassword": "NovaSenhaColab123",
        "confirmNewPassword": "NovaSenhaColab123"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Troca a senha do colaborador logado.
