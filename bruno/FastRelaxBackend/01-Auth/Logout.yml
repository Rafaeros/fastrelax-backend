info:
  name: Logout
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/auth/logout"
  auth:
    type: none
  body:
    type: json
    data: |-
      {
        "refreshToken": "{{refreshToken}}"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Invalida o `refreshToken` informado.
