info:
  name: Refresh Token
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/auth/refresh"
  auth:
    type: none
  body:
    type: json
    data: |-
      {
        "refreshToken": "{{refreshToken}}"
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody ? res.getBody() : res.body;
        const token = body?.data?.token || body?.data?.accessToken;
        const refresh = body?.data?.refreshToken;
        if (token) {
          bru.setEnvVar("accessToken", token);
          bru.setVar("accessToken", token);
        }
        if (refresh) {
          bru.setEnvVar("refreshToken", refresh);
          bru.setVar("refreshToken", refresh);
        }
        if (body?.data?.collaboratorId) {
          bru.setEnvVar("collaboratorId", String(body.data.collaboratorId));
        }
        if (body?.data?.companyId) {
          bru.setEnvVar("companyId", String(body.data.companyId));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Renova o par `token` + `refreshToken` e atualiza automaticamente as variáveis no Bruno.
