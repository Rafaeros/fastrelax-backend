info:
  name: Listar Sessões
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/collaborators/sessions?page=0&size=10"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Lista as sessões da empresa (ou apenas as próprias quando chamado pelo colaborador).
