info:
  name: Iniciar Minha Sessão Vigente
  type: http
  seq: 6

http:
  method: PATCH
  url: "{{baseUrl}}/collaborators/sessions/me/start"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Inicia a sessão atual do colaborador logado e envia comando `/start` ao ESP32.
