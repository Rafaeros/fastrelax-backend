info:
  name: Minha Sessão Atual (Colaborador)
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/collaborators/sessions/me/current"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Retorna a sessão agendada para agora ou em andamento do colaborador logado.
