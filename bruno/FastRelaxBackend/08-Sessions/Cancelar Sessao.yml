info:
  name: Cancelar Sessão
  type: http
  seq: 9

http:
  method: PATCH
  url: "{{baseUrl}}/collaborators/sessions/{{sessionId}}/cancel"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Cancela uma sessão agendada e libera o horário.
