info:
  name: Horários Disponíveis (Slots)
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/collaborators/sessions/available-slots?collaboratorId={{collaboratorId}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Lista os dias e horários livres dentro da janela permitida do colaborador.
