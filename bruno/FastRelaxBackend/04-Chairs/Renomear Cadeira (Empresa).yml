info:
  name: Renomear Cadeira (Empresa)
  type: http
  seq: 6

http:
  method: PATCH
  url: "{{baseUrl}}/chairs/{{chairId}}/name"
  auth: inherit
  body:
    type: json
    data: |-
      {
        "name": "Cadeira 01 - Recepção"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Permite ao RH/gestor da empresa alterar apenas o nome de exibição da cadeira.
