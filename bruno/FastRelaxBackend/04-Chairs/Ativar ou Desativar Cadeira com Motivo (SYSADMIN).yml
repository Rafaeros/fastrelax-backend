info:
  name: Ativar ou Desativar Cadeira com Motivo (SYSADMIN)
  type: http
  seq: 8

http:
  method: PATCH
  url: "{{baseUrl}}/chairs/{{chairId}}/toggle-active"
  auth: inherit
  body:
    type: json
    data: |-
      {
        "reason": "Manutenção preventiva no mecanismo da cadeira"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Ativa ou desativa fisicamente a cadeira (`chairs.active`, que controla o relé NC de corte de energia no ESP32) e grava o motivo no `audit_logs`.
