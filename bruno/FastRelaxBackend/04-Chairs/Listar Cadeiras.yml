info:
  name: Listar Cadeiras
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/chairs?page=0&size=20"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Lista as cadeiras (todas para `SYSADMIN`, ou apenas as da própria empresa para `COMPANY_ADMIN`/`COMPANY_RH`).
