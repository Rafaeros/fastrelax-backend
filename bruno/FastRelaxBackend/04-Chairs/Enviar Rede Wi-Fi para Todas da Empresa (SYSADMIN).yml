info:
  name: Enviar Rede Wi-Fi para Todas da Empresa (SYSADMIN)
  type: http
  seq: 11

http:
  method: POST
  url: "{{baseUrl}}/chairs/network/company/{{companyId}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Reenvia a configuração de Wi-Fi para todas as cadeiras ativas da empresa.
