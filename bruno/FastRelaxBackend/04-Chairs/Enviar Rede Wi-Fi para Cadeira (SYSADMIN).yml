info:
  name: Enviar Rede Wi-Fi para Cadeira (SYSADMIN)
  type: http
  seq: 10

http:
  method: POST
  url: "{{baseUrl}}/chairs/{{chairId}}/network"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Envia o SSID, senha e BSSID configurados na empresa para a NVS do ESP32.
