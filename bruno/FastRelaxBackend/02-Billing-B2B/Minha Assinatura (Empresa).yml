info:
  name: Minha Assinatura (Empresa)
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseUrl}}/billing/subscriptions/me"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Retorna a assinatura vigente da própria empresa logada, com contagem de colaboradores ativos, cadeiras ativas e valor estimado do próximo ciclo.
