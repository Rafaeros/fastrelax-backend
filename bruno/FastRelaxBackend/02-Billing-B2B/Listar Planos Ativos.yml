info:
  name: Listar Planos Ativos
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/billing/plans/active"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Lista as faixas de planos ativas ordenadas por número mínimo de colaboradores (`SYSADMIN` ou empresa).
